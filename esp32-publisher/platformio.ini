; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32cam
framework = arduino

; AI-Thinker board has no onboard USB-serial; flash through an external
; USB-TTL adapter. Adjust to match `ls /dev/cu.*` on your machine.
upload_port = /dev/cu.usbserial-AD9OE90Y
upload_speed = 57600
monitor_port = /dev/cu.usbserial-AD9OE90Y
monitor_speed = 115200

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; Real publisher firmware (WiFi + manager over TCP).
[env:esp32cam]
build_src_filter = +<*> -<camera_serial_test.cpp>

; Local hardware check: streams a frame over serial, no WiFi/manager needed.
[env:esp32cam_serial_test]
build_src_filter = +<*> -<main.cpp>
